name: Test & Deploy

on:
  push:
    branches: [main]
  # Handmatig starten kan ook.
  workflow_dispatch:

# Rechten die nodig zijn om naar GitHub Pages te publiceren.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; nieuwe pushes annuleren een lopende run niet halverwege.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Tests draaien en de statische site bouwen.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 2) Pas deployen als de build (incl. tests) is geslaagd.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
